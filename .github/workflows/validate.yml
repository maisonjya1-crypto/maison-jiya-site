name: Validate Maison Jiya

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dependency refresh branch
        uses: actions/checkout@v6
        with:
          ref: security/dependency-refresh-2026-09-16

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Refresh lockfile for security dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=critical

      - name: Commit generated lockfile to dependency refresh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock compatible dependency security fixes"
            git push origin HEAD:security/dependency-refresh-2026-09-16
          fi

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit diagnostic
        run: npm audit --json || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate private Android PWA
        run: node scripts/check-private-pwa.mjs

      - name: Validate storefront V3
        run: node scripts/check-storefront-v3.mjs

      - name: Validate storefront final hotfix
        run: node scripts/check-storefront-final-hotfix.mjs

      - name: Validate approved cover
        run: node scripts/check-approved-cover.mjs

      - name: Validate cover interactions and category photos
        run: node scripts/check-cover-interactions.mjs

      - name: Validate generated storefront assets
        run: node scripts/check-storefront-generated-assets.mjs

      - name: Validate storefront cover v5
        run: node scripts/check-storefront-cover-v5.mjs

      - name: Run all source and rendered HTML tests
        run: node --test tests/*.test.mjs

      - name: Production smoke diagnostic
        continue-on-error: true
        run: node scripts/smoke-production.mjs
