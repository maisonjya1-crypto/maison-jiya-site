name: Validate Maison Jiya

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Refresh lockfile for Next.js security patch
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-16.3.5-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate private Android PWA
        run: node scripts/check-private-pwa.mjs

      - name: Validate storefront V3
        run: node scripts/check-storefront-v3.mjs

      - name: Validate storefront final hotfix
        run: node scripts/check-storefront-final-hotfix.mjs

      - name: Validate approved cover
        run: node scripts/check-approved-cover.mjs

      - name: Validate cover interactions and category photos
        run: node scripts/check-cover-interactions.mjs

      - name: Validate generated storefront assets
        run: node scripts/check-storefront-generated-assets.mjs

      - name: Validate storefront cover v5
        run: node scripts/check-storefront-cover-v5.mjs

      - name: Run all source and rendered HTML tests
        run: node --test tests/*.test.mjs

      - name: Production smoke diagnostic
        continue-on-error: true
        run: node scripts/smoke-production.mjs
