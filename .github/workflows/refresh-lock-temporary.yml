name: Refresh lock temporary

on:
  push:
    branches:
      - fix/anonymous-physical-store-sales
    paths:
      - package.json
      - .github/workflows/refresh-lock-temporary.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/anonymous-physical-store-sales
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Refresh lock file
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lock for patched dependencies"
          git push origin HEAD:fix/anonymous-physical-store-sales
