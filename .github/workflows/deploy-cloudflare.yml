name: Deploy Maison Jiya to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maison-jiya-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply maison-jiya-pilotage-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production
        env:
          REQUIRE_REFERENCE_BLACK_DESIGN: "1"
        run: node scripts/smoke-production.mjs

      # Lien court gratuit maisonjiya.pages.dev (Cloudflare Pages + liaison vers le Worker).
      # N'empêche jamais la mise en ligne principale : en cas d'échec, seule l'adresse courte manque.
      - name: Create short link project (first time only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create maisonjiya --production-branch main

      # Le build du Worker laisse une redirection de config (.wrangler/deploy/config.json → dist/server)
      # que wrangler suivrait aussi pour Pages : on la retire, le Worker est déjà en ligne.
      - name: Prepare short link deploy
        run: rm -f .wrangler/deploy/config.json

      - name: Deploy short link maisonjiya.pages.dev
        id: short_link
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: short-link
          command: pages deploy public --project-name maisonjiya --branch main --commit-dirty=true

      - name: Verify short link
        if: steps.short_link.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL https://maisonjiya.pages.dev/boutique | grep -q 'data-storefront-deployment="maison-jiya-luxe-v7"'; then echo "maisonjiya.pages.dev OK"; exit 0; fi
            sleep 10
          done
          echo "maisonjiya.pages.dev ne répond pas encore"; exit 1

