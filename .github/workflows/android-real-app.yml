name: Build Maison Jiya Android App

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-real-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify native application icon
        run: test -s android/app/src/main/res/drawable/app_icon.xml

      - name: Build native Android v2.5
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify Android packages exist
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          echo "Installable debug APK and unsigned release APK ready"

      - name: Upload installable Android 2.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Maison-Jiya-Gestion-Android-2.5-Installable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Maison-Jiya-Gestion-Android-2.5-Unsigned-Release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android APK signer
        uses: actions/upload-artifact@v4
        with:
          name: Maison-Jiya-Android-ApkSigner
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 7
