name: Nettoyer les valeurs d entrainement

on:
  push:
    branches:
      - cleanup-false-values

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot stock before cleanup
        run: |
          npx wrangler d1 execute maison-jiya-pilotage-db --remote --command "SELECT id, stock_quantity FROM products ORDER BY id" --json > /tmp/products-before.json
          npx wrangler d1 execute maison-jiya-pilotage-db --remote --command "SELECT id, product_id, movement_type, quantity, note, created_at FROM stock_movements ORDER BY id" --json > /tmp/movements-before.json

      - name: Delete only identified false values
        run: npx wrangler d1 execute maison-jiya-pilotage-db --remote --file=scripts/cleanup-false-values-2026-09-25.sql

      - name: Snapshot stock after cleanup
        run: |
          npx wrangler d1 execute maison-jiya-pilotage-db --remote --command "SELECT id, stock_quantity FROM products ORDER BY id" --json > /tmp/products-after.json
          npx wrangler d1 execute maison-jiya-pilotage-db --remote --command "SELECT id, product_id, movement_type, quantity, note, created_at FROM stock_movements ORDER BY id" --json > /tmp/movements-after.json
          npx wrangler d1 execute maison-jiya-pilotage-db --remote --command "SELECT (SELECT COUNT(*) FROM orders WHERE order_ref IN ('MJ-WAKG4VED','MJ-WM8A8503','MJ-WPITTI45','MJ-W0FQWG4C')) AS false_orders_remaining, (SELECT COUNT(*) FROM order_status_history WHERE order_id IN (9,10,11,12)) AS false_history_remaining, (SELECT COUNT(*) FROM orders WHERE order_ref='MJ-WADFL33') AS real_order_remaining, (SELECT COUNT(*) FROM customers WHERE id=6) AS real_customer_remaining" --json > /tmp/cleanup-check.json

      - name: Verify cleanup and unchanged stock
        run: node scripts/verify-false-values-cleanup.mjs /tmp/products-before.json /tmp/products-after.json /tmp/movements-before.json /tmp/movements-after.json /tmp/cleanup-check.json
