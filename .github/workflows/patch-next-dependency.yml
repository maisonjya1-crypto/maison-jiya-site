name: Patch Next.js vulnerability on PageSpeed branch

on:
  push:
    branches:
      - perf/pagespeed-mobile-first-pass-20261021
    paths:
      - .github/workflows/patch-next-dependency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/pagespeed-mobile-first-pass-20261021
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Upgrade vulnerable Next.js and refresh npm lockfile
        run: npm install --package-lock-only --save-exact next@16.4.4
      - name: Verify locked dependencies can be installed
        run: npm ci
      - name: Verify production security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit the dependency fix to the PageSpeed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Next.js to audited 16.4.4"
            git push origin HEAD:perf/pagespeed-mobile-first-pass-20261021
          fi
